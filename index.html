<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clima Noetinger</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f7f2;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin-bottom: 5px;
        }

        h2 {
            color: #555;
            margin-top: 5px;
        }

        .contenedor {
            max-width: 900px;
            margin: 25px auto;
        }

        .reloj {
            background: white;
            width: 180px;
            height: 180px;
            margin: 15px;
            display: inline-flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
            border: 12px solid #ccc;
            box-sizing: border-box;
        }

        .reloj.general {
            width: 240px;
            height: 240px;
            border-width: 16px;
            margin-bottom: 35px;
        }

        .titulo {
            font-size: 18px;
            font-weight: bold;
        }

        .valor {
            font-size: 28px;
            font-weight: bold;
            margin: 8px;
        }

        .estado {
            font-size: 16px;
            font-weight: bold;
        }

        .verde {
            border-color: #2ecc71;
        }

        .amarillo {
            border-color: #f1c40f;
        }

        .rojo {
            border-color: #e74c3c;
        }

        .general-titulo {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        /* ENCABEZADO CON EL LOGO DE LA ESCUELA */
        .encabezado {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            max-width: 900px;
            margin: 0 auto 25px;
            padding: 15px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.10);
            box-sizing: border-box;
        }

        .logo-escuela {
            width: 95px;
            height: 95px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .encabezado h1 {
            margin: 0 0 8px;
            font-size: 25px;
        }

        .encabezado h2 {
            margin: 0;
            font-size: 17px;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .encabezado {
                gap: 10px;
                padding: 10px;
            }

            .logo-escuela {
                width: 75px;
                height: 75px;
            }

            .encabezado h1 {
                font-size: 19px;
            }

            .encabezado h2 {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <header class="encabezado">
        <img src="logo-escuela.png"
             alt="Logo del I.P.E.T. 411 de Noetinger"
             class="logo-escuela">

        <div>
            <h1>🌾 Aplicación agrícola</h1>
            <h2>📍 Noetinger, Córdoba</h2>
        </div>
    </header>

    <div class="contenedor">

        <!-- RELOJ GENERAL -->
        <div>
            <div class="general-titulo">
                🌾 CONDICIONES PARA COSECHAR
            </div>

            <div id="relojGeneral" class="reloj general">
                <div class="titulo">GENERAL</div>
                <div id="valorGeneral" class="valor">--</div>
                <div id="estadoGeneral" class="estado">
                    Cargando...
                </div>
            </div>
        </div>

        <!-- TEMPERATURA -->
        <div id="relojTemperatura" class="reloj">
            <div class="titulo">🌡️ Temperatura</div>
            <div id="temperatura" class="valor">--</div>
            <div id="estadoTemperatura" class="estado">
                Cargando...
            </div>
        </div>

        <!-- HUMEDAD -->
        <div id="relojHumedad" class="reloj">
            <div class="titulo">💧 Humedad</div>
            <div id="humedad" class="valor">--</div>
            <div id="estadoHumedad" class="estado">
                Cargando...
            </div>
        </div>

        <!-- VIENTO -->
        <div id="relojViento" class="reloj">
            <div class="titulo">💨 Viento</div>
            <div id="viento" class="valor">--</div>
            <div id="estadoViento" class="estado">
                Cargando...
            </div>
        </div>

        <!-- PRECIPITACIÓN -->
        <div id="relojLluvia" class="reloj">
            <div class="titulo">🌧️ Precipitación</div>
            <div id="lluvia" class="valor">--</div>
            <div id="estadoLluvia" class="estado">
                Cargando...
            </div>
        </div>

    </div>


    <script>

        // ==========================================
        // UBICACIÓN: NOETINGER, CÓRDOBA
        // ==========================================

        const latitud = -32.3667;
        const longitud = -62.6333;


        // ==========================================
        // API DEL CLIMA
        // ==========================================

        const url =
            `https://api.open-meteo.com/v1/forecast?latitude=${latitud}&longitude=${longitud}&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m&temperature_unit=celsius&wind_speed_unit=kmh&timezone=America%2FArgentina%2FCordoba`;


        // ==========================================
        // FUNCIONES PARA CAMBIAR LOS RELOJES
        // ==========================================

        function ponerEstado(idReloj, idEstado, estado) {

            const reloj = document.getElementById(idReloj);
            const texto = document.getElementById(idEstado);

            reloj.classList.remove("verde", "amarillo", "rojo");

            if (estado === "verde") {
                reloj.classList.add("verde");
                texto.textContent = "🟢 APTO";
            }

            if (estado === "amarillo") {
                reloj.classList.add("amarillo");
                texto.textContent = "🟡 INTERMEDIO";
            }

            if (estado === "rojo") {
                reloj.classList.add("rojo");
                texto.textContent = "🔴 NO APTO";
            }
        }


        // ==========================================
        // OBTENER CLIMA
        // ==========================================

        fetch(url)

            .then(response => response.json())

            .then(data => {

                const clima = data.current;


                // ==========================================
                // MOSTRAR DATOS
                // ==========================================

                document.getElementById("temperatura").textContent =
                    clima.temperature_2m + " °C";

                document.getElementById("humedad").textContent =
                    clima.relative_humidity_2m + " %";

                document.getElementById("viento").textContent =
                    clima.wind_speed_10m + " km/h";

                document.getElementById("lluvia").textContent =
                    clima.precipitation + " mm";


                // ==========================================
                // TEMPERATURA
                // ==========================================

                let estadoTemperatura;

                if (
                    clima.temperature_2m >= 15 &&
                    clima.temperature_2m <= 30
                ) {
                    estadoTemperatura = "verde";
                }

                else if (
                    (clima.temperature_2m >= 10 &&
                    clima.temperature_2m < 15) ||
                    (clima.temperature_2m > 30 &&
                    clima.temperature_2m <= 35)
                ) {
                    estadoTemperatura = "amarillo";
                }

                else {
                    estadoTemperatura = "rojo";
                }


                // ==========================================
                // HUMEDAD
                // ==========================================

                let estadoHumedad;

                if (
                    clima.relative_humidity_2m >= 40 &&
                    clima.relative_humidity_2m <= 70
                ) {
                    estadoHumedad = "verde";
                }

                else if (
                    (clima.relative_humidity_2m >= 30 &&
                    clima.relative_humidity_2m < 40) ||
                    (clima.relative_humidity_2m > 70 &&
                    clima.relative_humidity_2m <= 80)
                ) {
                    estadoHumedad = "amarillo";
                }

                else {
                    estadoHumedad = "rojo";
                }


                // ==========================================
                // VIENTO
                // ==========================================

                let estadoViento;

                if (clima.wind_speed_10m <= 20) {
                    estadoViento = "verde";
                }

                else if (clima.wind_speed_10m <= 30) {
                    estadoViento = "amarillo";
                }

                else {
                    estadoViento = "rojo";
                }


                // ==========================================
                // PRECIPITACIÓN
                // ==========================================

                let estadoLluvia;

                if (clima.precipitation === 0) {
                    estadoLluvia = "verde";
                }

                else if (clima.precipitation <= 2) {
                    estadoLluvia = "amarillo";
                }

                else {
                    estadoLluvia = "rojo";
                }


                // ==========================================
                // ACTUALIZAR RELOJES
                // ==========================================

                ponerEstado(
                    "relojTemperatura",
                    "estadoTemperatura",
                    estadoTemperatura
                );

                ponerEstado(
                    "relojHumedad",
                    "estadoHumedad",
                    estadoHumedad
                );

                ponerEstado(
                    "relojViento",
                    "estadoViento",
                    estadoViento
                );

                ponerEstado(
                    "relojLluvia",
                    "estadoLluvia",
                    estadoLluvia
                );


                // ==========================================
                // CONDICIÓN GENERAL
                // ==========================================

                let estadoGeneral;


                // Si alguno está rojo → ROJO
                if (
                    estadoTemperatura === "rojo" ||
                    estadoHumedad === "rojo" ||
                    estadoViento === "rojo" ||
                    estadoLluvia === "rojo"
                ) {
                    estadoGeneral = "rojo";
                }

                // Si no hay rojo pero alguno está amarillo → AMARILLO
                else if (
                    estadoTemperatura === "amarillo" ||
                    estadoHumedad === "amarillo" ||
                    estadoViento === "amarillo" ||
                    estadoLluvia === "amarillo"
                ) {
                    estadoGeneral = "amarillo";
                }

                // Si todos están verdes → VERDE
                else {
                    estadoGeneral = "verde";
                }


                // ==========================================
                // MOSTRAR GENERAL
                // ==========================================

                const relojGeneral =
                    document.getElementById("relojGeneral");

                const estadoGeneralTexto =
                    document.getElementById("estadoGeneral");

                const valorGeneral =
                    document.getElementById("valorGeneral");


                relojGeneral.classList.remove(
                    "verde",
                    "amarillo",
                    "rojo"
                );


                if (estadoGeneral === "verde") {

                    relojGeneral.classList.add("verde");

                    valorGeneral.textContent = "🟢";

                    estadoGeneralTexto.textContent =
                        "APTO PARA COSECHAR";
                }


                else if (estadoGeneral === "amarillo") {

                    relojGeneral.classList.add("amarillo");

                    valorGeneral.textContent = "🟡";

                    estadoGeneralTexto.textContent =
                        "CONDICIONES INTERMEDIAS";
                }


                else {

                    relojGeneral.classList.add("rojo");

                    valorGeneral.textContent = "🔴";

                    estadoGeneralTexto.textContent =
                        "NO APTO PARA COSECHAR";
                }

            })


            // ==========================================
            // ERROR
            // ==========================================

            .catch(error => {

                console.error("Error:", error);

                document.getElementById("estadoGeneral").textContent =
                    "❌ Error al obtener el clima";

            });

    </script>

</body>
</html>
